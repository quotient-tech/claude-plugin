# Releases the quotient plugin. Claude Code caches a plugin by its version and
# the marketplace serves the plugin at the tag its entry names, so users get
# exactly what a release tagged. Pull requests leave the version alone; this
# workflow sets it, points the marketplace at the new tag, and runs the checks
# CI would before anything is pushed.
#
# The commit and tag are pushed together, so main never names a tag that
# doesn't exist, and nothing is pushed if any step before that fails.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      # Keep in step with CLAUDE_CODE_VERSION in ci.yml.
      CLAUDE_CODE_VERSION: 2.1.307
      PLUGIN_JSON: plugins/quotient/.claude-plugin/plugin.json
      MARKETPLACE_JSON: .claude-plugin/marketplace.json
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run releases from main, not $GITHUB_REF."
            exit 1
          fi

      # The token stays out of .git/config while npm and Claude Code install and
      # run; only the steps that talk to GitHub get it, through env.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Work out the new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(jq -r .version "$PLUGIN_JSON")
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$PLUGIN_JSON version $current isn't X.Y.Z."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            patch) next="$major.$minor.$((patch + 1))" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            major) next="$((major + 1)).0.0" ;;
            *) echo "::error::bump must be patch, minor or major, not $BUMP."; exit 1 ;;
          esac
          echo "Releasing $next (was $current)." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Require a new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # --exit-code: 0 when the tag exists, 2 when it doesn't, anything else is an error.
          status=0
          git ls-remote --exit-code --tags "$remote" "refs/tags/$TAG" > /dev/null || status=$?
          case "$status" in
            0) echo "::error::Tag $TAG already exists."; exit 1 ;;
            2) ;;
            *) echo "::error::Couldn't check for tag $TAG (git ls-remote exited $status)."; exit 1 ;;
          esac

      # sed rather than jq, so the file keeps its layout and the release commit
      # changes one line.
      - name: Set the version in plugin.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          before="$RUNNER_TEMP/plugin.before.json"
          cp "$PLUGIN_JSON" "$before"
          sed -E 's/^([[:space:]]*"version":[[:space:]]*)"[^"]*"/\1"'"$VERSION"'"/' "$before" > "$PLUGIN_JSON"
          jq -e --arg v "$VERSION" '.version == $v' "$PLUGIN_JSON" > /dev/null
          diff <(jq -S 'del(.version)' "$before") <(jq -S 'del(.version)' "$PLUGIN_JSON")

      - name: Point the marketplace at the new tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          before="$RUNNER_TEMP/marketplace.before.json"
          cp "$MARKETPLACE_JSON" "$before"
          jq --arg tag "$TAG" '
            .plugins |= map(
              if .name == "quotient" then
                .source = {
                  source: "git-subdir",
                  url: "quotient-tech/claude-plugin",
                  path: "plugins/quotient",
                  ref: $tag
                }
              else . end)
          ' "$before" > "$MARKETPLACE_JSON"
          jq -e --arg tag "$TAG" '.plugins[] | select(.name == "quotient") | .source.ref == $tag' "$MARKETPLACE_JSON" > /dev/null
          diff <(jq -S 'del(.plugins[].source)' "$before") <(jq -S 'del(.plugins[].source)' "$MARKETPLACE_JSON")

      - name: Install dependencies
        run: npm ci
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: "Validate: marketplace manifest"
        run: claude plugin validate --strict .
      - name: "Validate: quotient plugin"
        run: claude plugin validate --strict plugins/quotient
      - name: "Tests: manifests, skills, scripts and setup fixture"
        run: npm test

      # main's ruleset requires a pull request, and this App is on its bypass
      # list. The App's key is a secret on the release environment, so only an
      # approved run from main can create the token.
      - name: Create a token that can push to main
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898277+github-actions[bot]@users.noreply.github.com"
          git add "$PLUGIN_JSON" "$MARKETPLACE_JSON"
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic "$remote" HEAD:main "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          echo "Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
